{% extends "base.html" %}
{% block title %}{{ page.title|striptags }} · {{ SITENAME }}{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ SITEURL }}/theme/css/article.css">{% endblock %}
{% block body_class %}page-page{% endblock %}
{% block content %}
<article class="reader">
  <header class="reader-header reader-header--plain">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">{{ page.content|safe }}</div>
</article>
{% endblock %}
