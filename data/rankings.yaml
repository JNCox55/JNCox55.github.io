# Video game rankings shown on /game-rankings/.
# Entries are sorted by `rank` when rendered, so order here doesn't matter.
#
#   rank:        position on the list (1 = best)
#   title:       game title
#   platform:    used for the platform filter chips
#   year:        release year
#   score:       0-100, drawn as a score bar
#   verdict:     one-liner
#   cover:       (optional) path under content/, e.g. images/covers/foo.png
#   review_slug: (optional) slug of a blog post reviewing the game

